name: Nubixedu Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Dev using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            PROJECT_DIR="${{ secrets.PROJECT_PATH_DEV }}"

            echo "➡️ Deploying DEV"
            echo "➡️ Project: $PROJECT_DIR"

            cd "$PROJECT_DIR"

            echo "➡️ Marking repository as safe"
            git config --global --add safe.directory "$PROJECT_DIR"

            echo "➡️ Preparing permissions for Git"
            sudo chown -R ${{ secrets.VPS_USER }}:www storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;
            sudo find storage bootstrap/cache -type d -exec chmod g+s {} \;

            echo "➡️ Syncing DEV branch"
            git fetch origin
            git reset --hard origin/dev
            git clean -fd

            echo "➡️ Installing dependencies"
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "➡️ Running school migrations"
            php artisan migrate:school

            echo "➡️ Ensuring Laravel directories exist"
            sudo mkdir -p storage/framework/views
            sudo mkdir -p storage/framework/cache/data
            sudo mkdir -p storage/framework/sessions
            sudo mkdir -p storage/logs
            sudo mkdir -p bootstrap/cache

            echo "➡️ Fixing Laravel permissions"
            sudo chown -R ${{ secrets.VPS_USER }}:www storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;
            sudo find storage bootstrap/cache -type d -exec chmod g+s {} \;

            echo "➡️ Clearing Laravel caches"
            php artisan optimize:clear || true

            echo "➡️ Restarting queue workers"
            php artisan queue:restart || true

            echo "➡️ Creating installation marker"
            touch storage/installed

            echo "✅ DEV deployment successful!"